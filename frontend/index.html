<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Management Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="hero-card">
      <div class="hero-copy">
        <p class="eyebrow">Ternak Klip Operations</p>
        <h1>Inventory Management Dashboard</h1>
        <p class="hero-text">
          Pantau stok produk warehouse secara real-time dari backend PostgreSQL/Supabase.
        </p>
      </div>
      <div class="hero-meta">
        <div class="metric-card">
          <span class="metric-label">Total Produk</span>
          <strong id="product-count">0</strong>
        </div>
        <div class="metric-card">
          <span class="metric-label">Status</span>
          <strong id="api-status">Memuat</strong>
        </div>
      </div>
    </section>

    <section class="table-card">
      <div class="table-header">
        <div>
          <p class="section-label">Live Inventory</p>
          <h2>Stok Produk</h2>
        </div>
        <button id="refresh-button" class="refresh-button" type="button">Refresh Data</button>
      </div>

      <p id="feedback" class="feedback" aria-live="polite">Mengambil data inventory...</p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product Name</th>
              <th>Stock Count</th>
              <th>Last Updated</th>
            </tr>
          </thead>
          <tbody id="inventory-body">
            <tr>
              <td colspan="3" class="empty-state">Belum ada data untuk ditampilkan.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
